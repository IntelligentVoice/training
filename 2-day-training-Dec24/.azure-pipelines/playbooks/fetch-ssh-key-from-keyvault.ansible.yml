# test this playbook with a new user account on the local machine like this:
# export NEWUSER=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c10) &&
# echo $NEWUSER && sudo useradd -m $NEWUSER &&
# sudo ansible-playbook -i localhost, -u $NEWUSER .azure-pipelines/playbooks/test.ansible.yml &&
# sudo deluser $NEWUSER
- name: Fetch SSH key from KeyVault
  hosts: localhost
  connection: local
  vars:
    keyvault: iv-nightlytests-keyvault
    key: nightly-tests-key-ec
    ssh_key_path: "/home/{{ ansible_user }}/.ssh/id_rsa"
  tasks:
    - name: Retrieve effective group ID
      ansible.builtin.command: "id -g {{ ansible_user }}"
      changed_when: false
      register: group_command

    - name: Decide the SSH directory
      block:
        - name: Check or create dir for the current user
          ansible.builtin.file:
            path: "{{ ssh_key_path | dirname }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ group_command.stdout }}"
            mode: '0700'
      rescue:
        - name: Creates directory in current path
          ansible.builtin.file:
            path: .ssh
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ group_command.stdout }}"
            mode: '0700'
        - name: Change ssh_key_path
          ansible.builtin.set_fact:
            ssh_key_path: .ssh

    - name: Fetch the SSH key, or create it if required
      block:
        - name: Try to fetch the SSH private key from KeyVault
          azure.azcollection.azure_rm_keyvaultsecret_info:
            vault_uri: "https://{{ keyvault }}.vault.azure.net"
            name: "{{ key }}"
          register: key_info
        - name: Save SSH private key to file
          ansible.builtin.copy:
            content: "{{ key_info.secrets[0].secret }}"
            dest: "{{ ssh_key_path }}"
            owner: "{{ ansible_user }}"
            group: "{{ group_command.stdout }}"
            mode: '0600'
        - name: Extract SSH public key from private key
          ansible.builtin.shell:
            cmd: ssh-keygen -y -f "{{ ssh_key_path }}" > "{{ ssh_key_path }}.pub"
            creates: "{{ ssh_key_path }}.pub"
      rescue:
        - name: Generate SSH private and public keys
          community.crypto.openssh_keypair:
            path: "{{ ssh_key_path }}"
            mode: '0600'

        - name: Upload the generated SSH private key to KeyVault
          azure.azcollection.azure_rm_keyvaultsecret:
            secret_name: "{{ key }}"
            keyvault_uri: "https://{{ keyvault }}.vault.azure.net"
            secret_value: "{{ lookup('file', ssh_key_path) }}"

    - name: Read the SSH public key
      ansible.builtin.command:
        cmd: cat "{{ ssh_key_path }}.pub"
      register: public_key_output
      changed_when: false

    - name: Display the SSH public key
      ansible.builtin.debug:
        msg: "{{ public_key_output.stdout }}"
